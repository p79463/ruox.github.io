<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>官方净值误差 · 基金组合监控</title><style>body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:980px;margin:24px auto;padding:0 16px;color:#202124;background:#f7f8fa}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin:12px 0}.muted{color:#6b7280;font-size:14px}a{color:#2563eb;text-decoration:none}.chart-wrap{overflow-x:auto;border:1px solid #edf0f4;border-radius:10px}svg{display:block;width:100%;min-width:760px;height:320px}.grid{stroke:#e5eaf0;stroke-width:1}.zero{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}.axis{stroke:#64748b}.tick{fill:#64748b;font-size:11px}.estimate{fill:none;stroke:#2563eb;stroke-width:3}.absolute{fill:none;stroke:#e11d48;stroke-width:2.5}.legend{display:flex;gap:18px;margin-top:8px;color:#475569;font-size:13px}.legend i{display:inline-block;width:18px;height:3px;margin:0 6px 3px 0}.blue{background:#2563eb}.red{background:#e11d48}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid #eef0f2}</style><style>/* Shared fund-analysis visual theme, inspired by the user's dark GitHub Pages blog. */

</style><script id="accuracy-data" type="application/json">{"data":{"status":"no_data","points":[],"by_fund":[],"warnings":["暂无已公布官方净值的审计样本；官方净值公布后运行 audit 才会生成曲线。"]}}</script></head><body><a href="../jj.html">← 返回组合总览</a><h1>官方净值与估值误差</h1><p class="muted">误差用于检查盘中估值或代理估值与之后公布的官方单位净值之间的偏差，不是收益率，也不是投资亏损。</p><section class="card"><div id="meta">正在读取审计数据…</div><div class="chart-wrap"><svg id="chart" viewBox="0 0 900 320" aria-label="官方净值估值误差曲线"></svg></div><div class="legend"><span><i class="blue"></i>平均方向误差</span><span><i class="red"></i>平均绝对误差</span></div><div id="warnings" class="muted"></div></section><section class="card"><h2>按基金统计</h2><div id="funds">正在读取…</div></section><script>function loadStatic(url,id){return fetch(url).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(()=>JSON.parse(document.getElementById(id).textContent));}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(points){const svg=document.getElementById('chart'),W=900,H=320,L=66,R=26,T=20,B=50;if(!points.length){svg.innerHTML='<text class="tick" x="22" y="48">暂无已审计官方净值样本</text>';return;}const vals=points.flatMap(p=>[Number(p.avg_error_pct),Number(p.avg_abs_error_pct)]).concat([0]),lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max((hi-lo)*.15,1),min=lo-pad,max=hi+pad,x=i=>L+i*(W-L-R)/(points.length-1||1),y=v=>T+(max-v)/(max-min)*(H-T-B),path=k=>points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(Number(p[k])).toFixed(1)).join(' '),fmt=v=>(v>0?'+':'')+v.toFixed(2)+'%';let out=['<line class="axis" x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'"/><line class="axis" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/>'];for(let i=0;i<=5;i++){const v=max-(max-min)*i/5,yy=y(v);out.push('<line class="grid '+(Math.abs(v)<.01?'zero':'')+'" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/><text class="tick" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+fmt(v)+'</text>');}const labelIds=[0,Math.floor((points.length-1)/2),points.length-1];labelIds.forEach(i=>out.push('<text class="tick" x="'+x(i)+'" y="'+(H-B+24)+'" text-anchor="middle">'+esc(points[i].date)+'</text>'));out.push('<path class="estimate" d="'+path('avg_error_pct')+'"/><path class="absolute" d="'+path('avg_abs_error_pct')+'"/>');svg.innerHTML=out.join('');document.getElementById('meta').textContent='已审计交易日：'+points.length+'；最新样本：'+points[points.length-1].date+'；最新覆盖基金：'+points[points.length-1].fund_count+' 只';}function render(data){draw(data.points||[]);document.getElementById('warnings').innerHTML=(data.warnings||[]).map(x=>'<div>提示：'+esc(x)+'</div>').join('');const rows=data.by_fund||[];document.getElementById('funds').innerHTML=rows.length?'<table><thead><tr><th>基金号</th><th>样本数</th><th>平均绝对误差</th><th>最大绝对误差</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+x.samples+'</td><td>'+Number(x.avg_abs_error_pct).toFixed(2)+'%</td><td>'+Number(x.max_abs_error_pct).toFixed(2)+'%</td></tr>').join('')+'</tbody></table>':'<div class="muted">暂无已审计基金</div>';}</script><script>loadStatic('./data/accuracy.json','accuracy-data').then(r=>r.json()).then(x=>render(x.data||{})).catch(e=>{document.getElementById('meta').textContent='读取失败：'+e;});</script></body></html>
