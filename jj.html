e[1]-base[0])*.02?'zero':'')+'" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/><text class="tick-label" x="'+(L-9)+'" y="'+(yy+4)+'" text-anchor="end">'+fmt(v,unit)+'</text>');} if(pct){for(let i=0;i<=5;i++){const v=pr[1]-(pr[1]-pr[0])*i/5;out.push('<text class="tick-label" x="'+(W-R+9)+'" y="'+(yp(v)+4)+'">'+fmt(v,'%')+'</text>');}} [0,Math.floor((points.length-1)/2),points.length-1].forEach(i=>out.push('<text class="tick-label" x="'+xa(i)+'" y="'+(H-B+24)+'" text-anchor="middle">'+esc(points[i].date)+'</text>')); out.push('<text class="axis-label" x="18" y="'+(T+10)+'" text-anchor="middle" transform="rotate(-90 18 '+(T+10)+')">'+(amount?'金额（元）':'收益率（%）')+'</text>'); if(pct&&amount)out.push('<text class="axis-label" x="'+(W-10)+'" y="'+(T+10)+'" text-anchor="middle" transform="rotate(90 '+(W-10)+' '+(T+10)+')">收益率（%）</text>'); out.push('<text class="axis-label" x="'+((L+W-R)/2)+'" y="'+(H-8)+'" text-anchor="middle">交易日</text>'); selected.forEach(k=>out.push('<path class="series-'+k+'" d="'+path(k,k==='holding_profit'?ya:yp)+'"/>')); svg.innerHTML=out.join(''); const cross=document.createElementNS('http://www.w3.org/2000/svg','line');cross.setAttribute('class','crosshair');cross.setAttribute('y1',T);cross.setAttribute('y2',H-B);cross.style.display='none';svg.appendChild(cross); const hit=document.createElementNS('http://www.w3.org/2000/svg','rect');hit.setAttribute('class','hit-area');hit.setAttribute('x',L);hit.setAttribute('y',T);hit.setAttribute('width',W-L-R);hit.setAttribute('height',H-T-B);svg.appendChild(hit); const dots=selected.map(k=>{const d=document.createElementNS('http://www.w3.org/2000/svg','circle');d.setAttribute('r','5');d.style.fill=colors[k];d.style.stroke='#fff';d.style.strokeWidth='2';d.style.display='none';svg.appendChild(d);return [k,d]});let locked=false;const show=e=>{if(locked&&e.type==='mousemove')return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const local=pt.matrixTransform(svg.getScreenCTM().inverse()),lx=local.x, function statusLabel(s){return ({intraday_proxy:'盘中代理估值',official_fallback:'官方净值回退',official_nav:'官方历史净值',unknown:'来源待确认',unavailable:'盘中估值不可用'})[s]||s||'暂无';}
function table(items, holding){if(!items.length)return '<div class="muted">暂无数据</div>'; return '<table><thead><tr><th>基金名称</th><th>基金号</th>'+(holding?'<th>权重</th><th>市值</th><th>主题</th>':'<th>主题</th>')+'</tr></thead><tbody>'+items.map(x=>'<tr><td>'+(x.code?'<a href="./fund-monitor/fund-detail.html?code='+esc(x.code)+'">'+esc(x.name)+'</a>':esc(x.name))+'</td><td>'+esc(x.code)+'</td>'+(holding?'<td>'+esc((x.weight_pct||0).toFixed(2))+'%</td><td>'+esc((x.current_value||0).toFixed(2))+'</td>':'')+'<td>'+esc(x.theme)+'</td></tr>').join('')+'</tbody></table>';}
Promise.all([loadStatic('./fund-monitor/data/overview.json','overview-data'),loadStatic('./fund-monitor/data/curve.json','curve-data'),loadStatic('./fund-monitor/data/account.json','account-data')]).then(([overview,curve,live])=>{const d=overview.data||{}, s=d.summary||{}, liveData=live.data||{}, liveCollect=liveData.account_collect||{}; if((liveData.holdings||[]).length){const total=Number(liveCollect.assets_collect||0); d.holdings=liveData.holdings.map(x=>({code:x.code,name:x.short_name,current_value:Number(x.holding_amount||0),theme:'养基宝默认账户'})); s.current_value=total; s.holding_profit=Number(liveCollect.hold_income||0); s.yesterday_profit=liveData.holdings.reduce((sum,x)=>sum+Number(x.yesterday_income||0),0); s.weights=Object.fromEntries(liveData.holdings.map(x=>[x.code,total?Number(x.holding_amount||0)/total*100:0]));} const p=(curve.data||{}).points||[], last=p[p.length-1]; document.getElementById('status').innerHTML='<div class="metric">'+esc((s.current_value||0).toFixed(2))+' 元</div><div>持有收益：'+esc((s.holding_profit||0).toFixed(2))+' 元；昨日收益：'+esc((s.yesterday_profit||0).toFixed(2))+' 元；估算现金：'+esc((s.estimated_cash||0).toFixed(2))+' 元</div><div>最新历史数据：'+(last?esc(last.date):'—')+'；已覆盖基金：'+(last?esc(last.fund_count):0)+'/8；状态：<span class="ok">'+(last?esc(statusLabel(last.status)):'暂无')+'</span></div><div class="warn">'+esc((curve.data||{}).warnings||[])+'</div>'; const a=d.allocation_advice||{}; document.getElementById('advice').innerHTML='<b>配置提示：</b>'+esc(a.action||'暂无')+'。'+esc(a.detail||'')+'<div class="muted">此处为规则辅助提示，不构成确定投资建议。</div>'; const holdings=d.holdings||[]; const weights=s.weights||{}; document.getElementById('holdings').innerHTML=table(holdings.map(x=>({...x,weight_pct:weights[x.code]||0})),true); const themes=Object.entries(s.theme_exposure||{}).map(([theme,x])=>({name:theme,code:'',theme:(x.weight_pct||0).toFixed(2)+'% / '+(x.value||0).toFixed(2)+' 元'})); document.getElementById('themes').innerHTML=table(themes,false); document.getElementById('watchlist').innerHTML=table(d.watchlist||[],false); drawConfigured(p); document.querySelectorAll('[data-series]').forEach(box=>box.addEventListener('change',()=>drawConfigured(p)));}).catch(e=>{document.getElementById('status').textContent='读取失败：'+e;});
</script></body></html>
